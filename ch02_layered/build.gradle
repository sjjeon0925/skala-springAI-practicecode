plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.skala'
version = '1.0.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

// 편집기·OS 가 달라도 한글 주석·프롬프트가 깨지지 않게 인코딩을 고정한다.
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Test).configureEach { systemProperty 'file.encoding', 'UTF-8' }
tasks.named('bootRun') { jvmArgs = ['-Dfile.encoding=UTF-8'] }

repositories { mavenCentral() }

// 교재 1장 — 계층 구조(Controller · Service · Repository · Mapper). AI 를 쓰지 않는다
// Day1 실습 — 위 계층 위에 ChatClient 를 얹는다(day1 패키지)

ext {
    // Spring AI BOM — 모듈 버전을 한 번에 맞춘다. 올릴 때는 이 한 줄만 바꾼다.
    springAiVersion = '1.1.8'
}

dependencies {
    // ── 웹 · 문서 ──────────────────────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'   // /swagger-ui.html
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // ── 계층 구조 예제용 저장소 ────────────────────────────────
    // H2 는 인메모리라 별도 설치 없이 그대로 뜬다.
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.h2database:h2'

    // 같은 DB 를 MyBatis 로도 읽는다(JPA 와 공존) — 동적 조건 검색·집계용.
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.4'

    // ── Spring AI (Day1 실습) ───────────────────────────────────
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'

    // ── 테스트 ─────────────────────────────────────────────────
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // @MybatisTest — Mapper 만 띄우는 슬라이스 테스트
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.4'
}

dependencyManagement {
    imports { mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}" }
}

tasks.named('test') { useJUnitPlatform() }

springBoot { mainClass = 'com.skala.ch02.Ch02Application' }
