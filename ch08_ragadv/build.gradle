plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.skala'
version = '1.0.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

// 편집기·OS 가 달라도 한글 주석·프롬프트가 깨지지 않게 인코딩을 고정한다.
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Test).configureEach { systemProperty 'file.encoding', 'UTF-8' }
tasks.named('bootRun') { jvmArgs = ['-Dfile.encoding=UTF-8'] }

repositories { mavenCentral() }

// 교재 9장 — RAG 심화(HyDE · 재순위 · 모듈형 RAG · 하이브리드 검색)

ext {
    // Spring AI BOM — 모듈 버전을 한 번에 맞춘다. 올릴 때는 이 한 줄만 바꾼다.
    springAiVersion = '1.1.8'
}

dependencies {
    // ── 웹 · 문서 ──────────────────────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'   // /swagger-ui.html
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'                  // /actuator/prometheus

    // ── Spring AI ─────────────────────────────────────────────
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'org.springframework.ai:spring-ai-advisors-vector-store'
    implementation 'org.springframework.ai:spring-ai-rag'                      // 모듈형 RAG
    implementation 'org.springframework.ai:spring-ai-tika-document-reader'

    // ── 테스트 ─────────────────────────────────────────────────
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

dependencyManagement {
    imports { mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}" }
}

tasks.named('test') { useJUnitPlatform() }

springBoot { mainClass = 'com.skala.ch08.Ch08Application' }
