# ============================================================
# STEP 06 - RAG with pgvector
#
# 실행 전: docker compose up -d  (같은 폴더의 docker-compose.yml)
# ============================================================
server:
  port: 8106

spring:
  # ── 벡터 저장소로 쓸 PostgreSQL 접속 정보 ──────────────────
  # docker-compose.yml에 정의한 값과 반드시 일치해야 한다.
  # (데모용 계정이다. 운영에서는 환경변수/시크릿으로 분리한다)
  datasource:
    url: jdbc:postgresql://localhost:5432/springai
    username: springai
    password: springai

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        # 답변을 생성하는 모델
        model: gpt-5-mini
      embedding:
        # 문서와 질문을 벡터로 바꾸는 임베딩 모델.
        # 중요: 적재할 때와 검색할 때 '같은' 임베딩 모델을 써야 한다.
        # 모델을 바꾸면 벡터 차원과 의미 공간이 달라져 기존 데이터를 재적재해야 한다.
        model: text-embedding-3-small

    vectorstore:
      pgvector:
        # true면 기동 시 vector_store 테이블과 인덱스를 자동 생성한다.
        # 학습용으로는 편리하지만, 운영에서는 스키마를 마이그레이션 도구로 관리하고
        # 이 값을 false로 두는 것이 안전하다.
        initialize-schema: true

        # 벡터 검색 인덱스 종류.
        # HNSW(Hierarchical Navigable Small World)는 근사 최근접 이웃 검색 알고리즘으로
        # 정확도와 속도의 균형이 좋아 일반적으로 권장된다.
        index-type: HNSW

        # 벡터 간 '가까움'을 재는 기준.
        # COSINE_DISTANCE(코사인 거리)는 벡터의 크기가 아닌 '방향'만 비교하므로
        # 문장 길이에 덜 민감해 텍스트 임베딩에 널리 쓰인다.
        distance-type: COSINE_DISTANCE
